# Nia toolchain configuration
# This file tells AI agents what tools are available and how to access them
#
# To switch access methods for a tool:
#   1. Comment out the current 'description' field (add # prefix to each line)
#   2. Uncomment your preferred method's description block
#   3. Update the 'method' field to match the new method
schema_version = "1.0.0"

# Issue tracker configuration
[issue_tracker]
name = "github_issues"
type = "built-in"
method = "skill"  # Options: "cli", "mcp", "api", "skill" (default)
description = """
When retrieving or reading issues from the issue tracker, use the "{{issue_tracker_skill_name}}" skill.
This skill provides guidance on authentication, commands, error handling, and workflow
best practices for your configured issue tracker.
"""

# [CLI Method]:
# description = """
# GitHub Issues for task and bug tracking.
# Access via 'gh issue' CLI commands.
#
# {{#if issue_tracker_repo_slug}}Repository: {{issue_tracker_repo_slug}}
#
# Common operations (repository configured — use --repo flag):
# - List issues:   gh issue list --repo {{issue_tracker_repo_slug}}
# - View issue:    gh issue view {{issue_id}} --repo {{issue_tracker_repo_slug}}
# - Create issue:  gh issue create --title "..." --body "..." --repo {{issue_tracker_repo_slug}}
# - Update issue:  gh issue edit {{issue_id}} --title "..." --repo {{issue_tracker_repo_slug}}
# - Update issue body: gh issue edit {{issue_id}} --body-file PATH --repo {{issue_tracker_repo_slug}}
# {{/if}}
# {{#unless issue_tracker_repo_slug}}Common operations:
# - List issues:   gh issue list
# - View issue:    gh issue view {{issue_id}}
# - Create issue:  gh issue create --title "..." --body "..."
# - Update issue:  gh issue edit {{issue_id}} --title "..."
# - Update issue body: gh issue edit {{issue_id}} --body-file PATH
# {{/unless}}
#
# Body content rules:
# - When a PR or issue body comes from a file, always pass the file with --body-file PATH.
# - Never pass file-sourced body content with --body "..." as an inline string; shell
#   quoting turns real line breaks into a literal backslash-n sequence and breaks markdown
#   rendering.
# - --body-file also avoids the shell argument length limit for long descriptions.
# """

# [MCP Method]:
# description = """
# GitHub Issues for task and bug tracking.
# Access via GitHub MCP Server.
# The MCP server provides tools for listing, viewing, and managing issues.
# All authentication is handled by the MCP server configuration.
# When updating an issue body from a local file, pass the exact file contents as the body
# parameter. The MCP transport encodes newlines for you; never pre-escape them.
# """

# [API Method]:
# description = """
# GitHub Issues for task and bug tracking.
# Access via GitHub REST API.
#
# Authentication: API token required
# - Environment variable: NIA_ISSUE_TOKEN
# - Scope: Read and write access to repository issues
# - Management: User-managed; set externally before running Nia
# - Security: Nia does not inject tokens into logs, traces, or prompts
#
# The Coding Agent will read this token dynamically when making API calls.
#
# Repository placeholders: {{issue_tracker_repo_owner}}/{{issue_tracker_repo_name}}
#
# Common operations:
# - List issues: GET /repos/{{issue_tracker_repo_owner}}/{{issue_tracker_repo_name}}/issues
# - View issue: GET /repos/{{issue_tracker_repo_owner}}/{{issue_tracker_repo_name}}/issues/{{issue_id}}
# - Create issue: POST /repos/{{issue_tracker_repo_owner}}/{{issue_tracker_repo_name}}/issues
# - Update issue: PATCH /repos/{{issue_tracker_repo_owner}}/{{issue_tracker_repo_name}}/issues/{{issue_id}}
# - Close issue: PATCH /repos/{{issue_tracker_repo_owner}}/{{issue_tracker_repo_name}}/issues/{{issue_id}} (set state: closed)
#
# Note: When repository placeholders are empty (not configured), use auto-detected repository information from Git remote.
#
# When the new body comes from a file, send the file contents as the raw body field, for
# example: gh api --method PATCH repos/{{issue_tracker_repo_owner}}/{{issue_tracker_repo_name}}/issues/{{issue_id}} -F body=@PATH
# Do not hand-build the JSON payload as a string.
# """

# Ticket tracker configuration
[ticket_tracker]
name = "github_issues"
type = "built-in"
method = "skill"  # Options: "cli", "mcp", "api", "skill" (default)
description = """
When working with support tickets:
- To read tickets: use the "{{ticket_tracker_skill_name}}" skill
- To respond to tickets: use the "ticket-respond-{{ticket_tracker_tool_variant}}" skill

These skills provide guidance on ticket workflows, response formatting,
and ticket system best practices.
"""

